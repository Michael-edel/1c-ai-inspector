services:
  caddy:
    image: caddy:2.9.1
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      IDP_DOMAIN: ${IDP_DOMAIN}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      keycloak:
        condition: service_started
    restart: unless-stopped

  backend:
    ports: !reset []

  frontend:
    ports: !reset []

  keycloak:
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:

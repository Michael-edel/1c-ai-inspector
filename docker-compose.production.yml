services:
  postgres:
    ports: !reset []
    restart: unless-stopped

  backend:
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  worker:
    restart: unless-stopped

  frontend:
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    restart: unless-stopped

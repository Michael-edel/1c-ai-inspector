services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD}
      RUNTIME_DB_USER: ${RUNTIME_DB_USER}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      RUNTIME_DB_USER: ${RUNTIME_DB_USER}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "for attempt in 1 2 3 4 5; do alembic upgrade head && exit 0; sleep 5; done; exit 1"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      MCP_SERVER_URL: ${MCP_SERVER_URL}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable-http}
      MCP_BRIDGE_TOKEN: ${MCP_BRIDGE_TOKEN:-}
      MCP_PROJECTS_TOOL: ${MCP_PROJECTS_TOOL:-}
      MCP_PATCH_SEARCH_TOOL: ${MCP_PATCH_SEARCH_TOOL:-search_code}
      MCP_PATCH_SEARCH_ARGUMENT: ${MCP_PATCH_SEARCH_ARGUMENT:-query}
      MODEL_PROVIDER: ${MODEL_PROVIDER}
      MODEL_NAME: ${MODEL_NAME}
      MODEL_API_URL: ${MODEL_API_URL:-https://api.openai.com/v1}
      MODEL_API_KEY: ${MODEL_API_KEY}
      MODEL_INPUT_COST_PER_1K: ${MODEL_INPUT_COST_PER_1K}
      MODEL_OUTPUT_COST_PER_1K: ${MODEL_OUTPUT_COST_PER_1K}
      MODEL_RETRIES: ${MODEL_RETRIES:-1}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-12000000}
      MCP_POLICY_PATH: ${MCP_POLICY_PATH:-/app/mcp_policy.yaml}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      PATCH_GIT_REPOSITORY: ${PATCH_GIT_REPOSITORY:-}
      SANDBOX_EXECUTOR_ENABLED: ${SANDBOX_EXECUTOR_ENABLED:-false}
      SANDBOX_SOURCE_REPOSITORY: ${SANDBOX_SOURCE_REPOSITORY:-}
      SANDBOX_ROOT: ${SANDBOX_ROOT:-}
      SANDBOX_VALIDATION_COMMAND: ${SANDBOX_VALIDATION_COMMAND:-}
      SANDBOX_TEST_COMMAND: ${SANDBOX_TEST_COMMAND:-}
      SANDBOX_COMMAND_TIMEOUT_SEC: ${SANDBOX_COMMAND_TIMEOUT_SEC:-300}
      INSPECTOR_AUTH_SECRET: ${INSPECTOR_AUTH_SECRET:-}
      INSPECTOR_AUTH_SECRET_PREVIOUS: ${INSPECTOR_AUTH_SECRET_PREVIOUS:-}
      INSPECTOR_AUTH_SECRET_PREVIOUS_UNTIL: ${INSPECTOR_AUTH_SECRET_PREVIOUS_UNTIL:-}
      INSPECTOR_PACKAGE_SIGNING_SECRET: ${INSPECTOR_PACKAGE_SIGNING_SECRET:-}
      INSPECTOR_AUTH_MODE: ${INSPECTOR_AUTH_MODE:-signed}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      AUTH_ROLES_CLAIM: ${AUTH_ROLES_CLAIM:-roles}
      AUTH_SUBJECT_CLAIM: ${AUTH_SUBJECT_CLAIM:-sub}
      AUTH_JWKS_CACHE_TTL_SEC: ${AUTH_JWKS_CACHE_TTL_SEC:-300}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      MCP_SERVER_URL: ${MCP_SERVER_URL}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable-http}
      MCP_BRIDGE_TOKEN: ${MCP_BRIDGE_TOKEN:-}
      MCP_PROJECTS_TOOL: ${MCP_PROJECTS_TOOL:-}
      MCP_PATCH_SEARCH_TOOL: ${MCP_PATCH_SEARCH_TOOL:-search_code}
      MCP_PATCH_SEARCH_ARGUMENT: ${MCP_PATCH_SEARCH_ARGUMENT:-query}
      MODEL_PROVIDER: ${MODEL_PROVIDER}
      MODEL_NAME: ${MODEL_NAME}
      MODEL_API_URL: ${MODEL_API_URL:-https://api.openai.com/v1}
      MODEL_API_KEY: ${MODEL_API_KEY}
      MODEL_INPUT_COST_PER_1K: ${MODEL_INPUT_COST_PER_1K}
      MODEL_OUTPUT_COST_PER_1K: ${MODEL_OUTPUT_COST_PER_1K}
      MODEL_RETRIES: ${MODEL_RETRIES:-1}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-12000000}
      MCP_POLICY_PATH: ${MCP_POLICY_PATH:-/app/mcp_policy.yaml}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      INSPECTOR_AUTH_SECRET: ${INSPECTOR_AUTH_SECRET:-}
      INSPECTOR_AUTH_SECRET_PREVIOUS: ${INSPECTOR_AUTH_SECRET_PREVIOUS:-}
      INSPECTOR_AUTH_SECRET_PREVIOUS_UNTIL: ${INSPECTOR_AUTH_SECRET_PREVIOUS_UNTIL:-}
      INSPECTOR_PACKAGE_SIGNING_SECRET: ${INSPECTOR_PACKAGE_SIGNING_SECRET:-}
      INSPECTOR_AUTH_MODE: ${INSPECTOR_AUTH_MODE:-signed}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      AUTH_ROLES_CLAIM: ${AUTH_ROLES_CLAIM:-roles}
      AUTH_SUBJECT_CLAIM: ${AUTH_SUBJECT_CLAIM:-sub}
      AUTH_JWKS_CACHE_TTL_SEC: ${AUTH_JWKS_CACHE_TTL_SEC:-300}
      WORKER_POLL_INTERVAL_SEC: ${WORKER_POLL_INTERVAL_SEC:-1}
      WORKER_HEARTBEAT_INTERVAL_SEC: ${WORKER_HEARTBEAT_INTERVAL_SEC:-15}
      WORKER_LEASE_TIMEOUT_SEC: ${WORKER_LEASE_TIMEOUT_SEC:-600}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker"]

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
